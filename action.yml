name: Simple Dependency Risk
description: Warn on risky dependency upgrades such as major version bumps and auth-sensitive packages.
author: Dmytro Paduchak
branding:
  icon: package
  color: purple
inputs:
  github-token:
    description: Token used to read the PR diff and post sticky PR comments.
    required: false
    default: ${{ github.token }}
  fail-on:
    description: "none = report only; medium or high = fail the job when findings match that severity."
    required: false
    default: none
runs:
  using: node20
  main: dist/index.js
